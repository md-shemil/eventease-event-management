spring.application.name=notification-service
server.port=8084

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:notification_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT
app.jwt.secret=EventEaseSuperSecretSecurityKey2026WithSufficientLengthForHMACSHA256SignatureVerification
app.jwt.expiration-ms=86400000

logging.level.com.eventease=INFO
