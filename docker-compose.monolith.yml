# ====================================================================
# EventEase - Monolithic Docker Compose Deployment
# ====================================================================
# Runs frontend + single monolithic Spring Boot backend + MySQL database
# Usage: docker compose -f docker-compose.monolith.yml up -d
# ====================================================================

services:
  mysql-db:
    image: mysql:8.0
    container_name: eventease-monolith-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-event_management}
      MYSQL_USER: ${MYSQL_USER:-eventease}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-EventEase@2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-RootPassword@2026}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_monolith_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-RootPassword@2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - eventease-monolith-network

  backend:
    build:
      context: ./event-management
      dockerfile: Dockerfile
    container_name: eventease-monolith-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:-event_management}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-eventease}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-EventEase@2026}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-EventEaseSuperSecretSecurityKey2026WithSufficientLengthForHMACSHA256SignatureVerification}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - eventease-monolith-network

  frontend:
    build:
      context: ./eventease-frontend
      dockerfile: Dockerfile
    container_name: eventease-monolith-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - eventease-monolith-network

networks:
  eventease-monolith-network:
    driver: bridge

volumes:
  mysql_monolith_data:
    driver: local
