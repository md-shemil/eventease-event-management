worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$upstream_addr"';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Upstream Microservices
    upstream user_service {
        server user-service:8081;
        keepalive 32;
    }

    upstream event_service {
        server event-service:8082;
        keepalive 32;
    }

    upstream registration_service {
        server registration-service:8083;
        keepalive 32;
    }

    upstream notification_service {
        server notification-service:8084;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name localhost;

        # Healthcheck endpoint
        location /health {
            default_type application/json;
            return 200 '{"status":"UP","service":"EventEase API Gateway"}';
        }

        # Unified Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;

        # -------------------------------------------------------------
        # 1. User & Authentication Service Routes
        # -------------------------------------------------------------
        location /api/auth/ {
            proxy_pass http://user_service/api/auth/;
        }

        location = /api/users/me {
            proxy_pass http://user_service/api/users/me;
        }

        location = /api/admin/users {
            proxy_pass http://user_service/api/admin/users;
        }

        location /api/users/count {
            proxy_pass http://user_service/api/users/count;
        }

        # -------------------------------------------------------------
        # 2. Registration & Bookmark Service Routes
        # -------------------------------------------------------------
        location = /api/users/me/registrations {
            proxy_pass http://registration_service/api/users/me/registrations;
        }

        location = /api/users/me/bookmarks {
            proxy_pass http://registration_service/api/users/me/bookmarks;
        }

        # Event registration & bookmark actions:
        # /api/events/{id}/register, /api/events/{id}/registrations, /api/events/{id}/bookmark
        location ~ ^/api/events/([0-9]+)/(register|registrations|bookmark) {
            proxy_pass http://registration_service$request_uri;
        }

        location /api/registrations {
            proxy_pass http://registration_service/api/registrations;
        }

        location /api/bookmarks {
            proxy_pass http://registration_service/api/bookmarks;
        }

        # -------------------------------------------------------------
        # 3. Notification Service Routes
        # -------------------------------------------------------------
        location /api/notifications {
            proxy_pass http://notification_service/api/notifications;
        }

        # -------------------------------------------------------------
        # 4. Event & Category Service Routes
        # -------------------------------------------------------------
        location /api/categories {
            proxy_pass http://event_service/api/categories;
        }

        location /api/admin/ {
            proxy_pass http://event_service/api/admin/;
        }

        location /api/events {
            proxy_pass http://event_service/api/events;
        }
    }
}
