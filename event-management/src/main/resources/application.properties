spring.application.name=event-management
server.port=8080

# ===================================================================
# Database & JDBC Configuration
# ===================================================================
# Default embedded H2 database with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:event_management;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# SQL Schema Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# H2 Web Console (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Repository Implementation: 'jdbc' (Default) or 'in-memory'
app.repository.type=jdbc

# ===================================================================
# MySQL Server Settings (Uncomment below to connect to local MySQL)
# ===================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/event_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=eventease
# spring.datasource.password=EventEase@2026
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql

# ===================================================================
# JWT Configuration
# ===================================================================
app.jwt.secret=EventEaseSuperSecretSecurityKey2026WithSufficientLengthForHMACSHA256SignatureVerification
app.jwt.expiration-ms=86400000

# ===================================================================
# Logging
# ===================================================================
logging.level.com.eventease=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.jdbc=DEBUG
